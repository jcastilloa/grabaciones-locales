name: "CodeQL Analysis"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]
  # Runs once a week on Monday at 01:30 UTC
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

# Ensure only one analysis runs at a time per PR/branch
concurrency:
  # If in PR, we use the PR number so that multiples push cancel the previous job
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze CodeQL
    runs-on: ubuntu-latest
    # Timeout. Build and scan should not take longer than 30 minutes
    timeout-minutes: 30
    permissions:
      # To scan the Github CI
      actions: read
      # Fetch project files
      contents: read
      # Write security report
      security-events: write
    # True when not pull request, if pull request AND is from weblate-translations branch AND is from weblate user, we skip CodeQL
    if: "github.event_name != 'pull_request' || !(github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'weblate-translations' && contains(github.actor, 'weblate')))"

    strategy:
      fail-fast: false
      matrix:
        include:
          # Scan java & kotlin, and we will build ourself
          - language: java-kotlin
            build-mode: manual
          # Scan Github Workflow CI, no build needed
          - language: actions
            build-mode: none

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      # Build steps should replicate build-app.yml file
      - name: Setup Java 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad #v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 #v6.4.0
        with:
          validate-wrappers: true
          cache-provider: basic
          gradle-version: '9.8.2'
          # MUST BE READ ONLY TO PREVENT CACHE POISONING
          cache-read-only: true
      
      - name: Generate Missing Gradle Wrapper Scripts
        if: matrix.language == 'java-kotlin'
        env:
          SKIP_SIGNING: true # Prevent build.gradle.kts from throwing error due to missing signing info
        run: gradle wrapper --no-daemon

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build App for CodeQL Analysis
        if: matrix.language == 'java-kotlin'
        env:
          SKIP_SIGNING: true
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-build-cache --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
